name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/muhr-nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/muhr-nexus/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - run: npm run build
